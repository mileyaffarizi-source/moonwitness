name: Temporary pnpm lockfile migration probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-lockfile:
    name: Generate pnpm 12 lockfile metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Generate lockfile with pnpm 12
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Print generated lockfile for review
        run: cat pnpm-lock.yaml
